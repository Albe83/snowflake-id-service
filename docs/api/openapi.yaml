openapi: "3.1.0"

info:
  title: Snowflake ID Service
  version: "0.1.0"
  description: >
    REST microservice for generating 128-bit UUIDv7 IDs
    (48-bit Unix timestamp ms + 74-bit random, RFC 9562).
    Stateless, zero-coordination, Kubernetes-ready.

servers:
  - url: http://localhost:8080
    description: Local / dev

paths:
  /v1/ids:
    post:
      operationId: generateIds
      summary: Generate one or more UUIDv7 IDs
      description: >
        Generates 1 to 1000 UUIDv7 IDs in a single call.
        If the `count` parameter is omitted, a single ID is generated.
        All IDs share the same timestamp (acquired once).
      tags: [IDs]
      parameters:
        - name: count
          in: query
          required: false
          description: Number of IDs to generate. Default 1, max 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
            example: 3
      responses:
        "200":
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/ids/{id}:
    get:
      operationId: decodeId
      summary: Decode a UUIDv7 into its components
      description: >
        Extracts timestamp, version, variant, and random payload from a UUIDv7.
        Returns 404 if the ID is not a valid UUIDv7.
      tags: [IDs]
      parameters:
        - name: id
          in: path
          required: true
          description: Canonical UUID string (36 chars, lowercase hex).
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
            example: "018f3a2c-9e5b-7000-8000-123456789abc"
      responses:
        "200":
          description: Decode completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The specified ID is not a valid UUIDv7.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/NotReady"

  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness probe
      description: >
        Always returns 200 if the process is alive.
        Used by Kubernetes as a liveness probe.
      tags: [Health]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /readyz:
    get:
      operationId: readyCheck
      summary: Readiness probe
      description: >
        Returns 200 if the service is ready to accept requests.
        Returns 503 during graceful shutdown (drain).
        Used by Kubernetes as a readiness probe.
      tags: [Health]
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: Service is not ready (drain in progress).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: >
        Exposes metrics in Prometheus text format.
        Content generated via the client_golang default registry
        (e.g. `go_goroutines`, `process_open_fds`, custom metrics).
      tags: [Observability]
      responses:
        "200":
          description: Metrics in Prometheus text format.
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    GenerateResponse:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: List of generated UUIDv7 IDs.
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
            example: "018f3a2c-9e5b-7000-8000-123456789abc"

    DecodeResponse:
      type: object
      required: [id, timestamp_ms, timestamp_iso, version, variant, random_bytes]
      properties:
        id:
          type: string
          format: uuid
          description: The canonical UUID received.
          example: "018f3a2c-9e5b-7000-8000-123456789abc"
        timestamp_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds (48-bit).
          example: 1717500204000
        timestamp_iso:
          type: string
          format: date-time
          description: Timestamp in ISO 8601 format.
          example: "2024-06-04T10:03:24.000Z"
        version:
          type: integer
          description: UUID version (always 7 for UUIDv7).
          example: 7
          enum: [7]
        variant:
          type: string
          description: UUID variant in binary notation.
          example: "10xx"
          enum: ["10xx"]
        random_bytes:
          type: string
          description: Random payload (74 bits) in hexadecimal.
          example: "00008000123456789abc"

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Service status.
          example: "ok"
          enum: ["ok"]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error description.
          example: "batch size must be between 1 and 1000"

  responses:
    BadRequest:
      description: Invalid request (malformed or out-of-range input).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error (e.g. crypto/rand failure).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotReady:
      description: Service is not ready (shutdown in progress).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

tags:
  - name: IDs
    description: UUIDv7 generation and decoding
  - name: Health
    description: Liveness and readiness probes
  - name: Observability
    description: Metrics and diagnostics
